<mat-card
  class="daxa-card ave-resolution-time-card mb-25 bg-white border-radius border-none d-block"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Pasos Realizados Hoy</h5>
    </mat-card-title>
    <mat-card-subtitle>
      <span class="card-header-menu-btn" style="cursor: default;">Hoy</span>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (isLoading()) {
      <div class="text-center py-4">
        <span class="text-body">Cargando...</span>
      </div>
    } @else {
      <div class="text-center py-4">
        <h3 class="lh-1 mb-0">
          {{ formattedSteps() }}
        </h3>
        <p class="text-body mb-0 mt-2">pasos</p>
      </div>
    }
  </mat-card-content>
</mat-card>
