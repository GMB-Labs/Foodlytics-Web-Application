<div
    class="coming-soon-area bg-white"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <div class="row mr-0 mr-0">
        <div class="col-lg-5 col-md-12 pl-0 pr-0">
            <div class="coming-soon-left bg-gradient text-center">
                <div class="d-table">
                    <div class="d-table-cell">
                        <img ngSrc="assets/images/coming-soon/coming-soon.png" alt="coming-soon-image" height="400"
                             width="400">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-7 col-md-12 pl-0 pr-0">
            <div class="coming-soon-right text-center position-relative">
                <div class="d-table">
                    <div class="d-table-cell">
                        <a routerLink="/" class="logo d-inline-block">
                            <img ngSrc="assets/images/logo.svg" alt="logo" height="82" width="89">
                        </a>
                        <span class="sub-title d-block">
                            Website is under maintenance
                        </span>
                        <h1 class="text-primary fw-bold lh-1">
                            WE ARE LAUNCHING SOON
                        </h1>
                        <p class="text-black">
                            Be the first to know when our site is live
                        </p>
                        <form>
                            <mat-form-field>
                                <mat-label>
                                    Email address
                                </mat-label>
                                <input matInput>
                            </mat-form-field>
                            <button mat-button>
                                Submit
                            </button>
                        </form>
                    </div>
                </div>
                <img ngSrc="assets/images/coming-soon/shape1.png" class="shape1" alt="shape1" height="101" width="210">
                <img ngSrc="assets/images/coming-soon/shape2.png" class="shape2" alt="shape2" height="30" width="43">
                <img ngSrc="assets/images/coming-soon/shape3.png" class="shape3" alt="shape3" height="223" width="288">
                <img ngSrc="assets/images/coming-soon/shape4.png" class="shape4" alt="shape4" height="225" width="250">
                <img ngSrc="assets/images/coming-soon/shape5.png" class="shape5" alt="shape5" height="45" width="34">
                <img ngSrc="assets/images/coming-soon/shape6.png" class="shape6" alt="shape6" height="219" width="200">
            </div>
        </div>
    </div>
</div>
