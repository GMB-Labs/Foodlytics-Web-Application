<!-- To Do List -->
<mat-card
  class="daxa-card to-do-list-card mb-25 border-radius bg-white border-none d-block"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Kan Ban List</h5>
    </mat-card-title>
    <mat-card-subtitle></mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="to-do-list-table">
      @if (isLoading()) {
        <div class="loading-container">
          <div class="spinner-wrapper">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
        </div>
      } @else {
        <div class="table-responsive">
          <table mat-table [dataSource]="formattedTasks()">
            <ng-container matColumnDef="task">
              <th mat-header-cell *matHeaderCellDef>Task</th>
              <td mat-cell *matCellDef="let task">
                <span class="task-name d-block">{{ task.taskName }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="daysLeft">
              <th mat-header-cell *matHeaderCellDef>Days Left</th>
              <td mat-cell *matCellDef="let task">
                <span
                  class="d-block"
                  [class.text-danger]="task.daysLeftColorClass === 'text-danger'"
                  [class.text-warning]="task.daysLeftColorClass === 'text-warning'"
                  [class.text-daxa]="task.daysLeftColorClass === 'text-daxa'"
                >
                  {{ task.daysLeftLabel }}
                </span>
              </td>
            </ng-container>

            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let task">
                <span
                  class="daxa-badge d-inline-block"
                  [class.status-backlog]="task.statusClass === 'status-backlog'"
                  [class.status-in-progress]="task.statusClass === 'status-in-progress'"
                  [class.status-review]="task.statusClass === 'status-review'"
                  [class.status-completed]="task.statusClass === 'status-completed'"
                >
                  {{ task.statusLabel }}
                </span>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
          @if (!formattedTasks().length) {
            <p class="text-center mb-0">No tasks to display.</p>
          }
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
