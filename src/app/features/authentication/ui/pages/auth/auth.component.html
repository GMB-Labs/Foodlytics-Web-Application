<div class="auth-area">
    <div class="d-table">
        <div class="d-table-cell">
            <div
                class="daxa-form ml-auto mr-auto border-radius bg-white"
                [class.card-borderd-theme]="themeService.isCardBorder()"
                [class.component-dark-theme]="themeService.isDark()"
            >
                <div class="title text-center">
                    <h3>
                        Bienvenido a Foodlytics // falta pulir
                    </h3>
                    <p class="ml-auto mr-auto">
                        Organiza pacientes, registra comidas y analiza métricas en un solo lugar
                    </p>
                </div>
                <div class="admin text-center">
                    <div class="logo position-relative rounded-circle">
                        <img ngSrc="../../../../../../assets/images/logo.svg" alt="logo" height="100" width="122" priority>
                    </div>
                    <span class="d-block fw-medium">
                        Accede para continuar
                    </span>
                </div>
                <button mat-button class="btn" type="button" (click)="login()">
                    Iniciar sesión
                </button>
                <div class="info d-flex justify-content-between align-items-center">
                    <mat-checkbox>
                        test
                    </mat-checkbox>
                    <a routerLink="/authentication/forgot-password" class="d-inline-block text-daxa" (click)="forgotPassword()">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <button mat-button class="btn" type="button" (click)="register()">
                    Crear Cuenta
                </button>
            </div>
        </div>
    </div>
</div>
