<mat-card
  class="daxa-card completion-status-card mb-25 border-radius bg-white border-none d-block"
  [class.component-dark-theme]="themeService.isDark()"
>
  <mat-card-content>
    <div class="title">
      <h5>Meta Calórica Diaria</h5>
      <div class="number fw-medium lh-1">
        {{ calorieCard().targetLabel }}
      </div>
    </div>
    <div class="icon text-center rounded-circle text-white position-relative">
      <img
        ngSrc="../../../../../../../../assets/images/icons/school.svg"
        alt="school-icon"
        height="50"
        width="51"
      />
    </div>
    <div class="info d-flex align-items-center justify-content-between">
      <span class="sub-title d-block text-body">
        {{ calorieCard().consumedLabel }}
      </span>
      <span
        class="daxa-up-down-badge position-relative"
        [ngClass]="{
          down: calorieCard().badgeClass === 'down',
          up: calorieCard().badgeClass === 'up'
        }"
      >
        <i class="material-symbols-outlined">
          {{ calorieCard().badgeIcon }}
        </i>
        {{ calorieCard().differenceLabel }} · {{ calorieCard().statusLabel }}
      </span>
    </div>
  </mat-card-content>
</mat-card>
