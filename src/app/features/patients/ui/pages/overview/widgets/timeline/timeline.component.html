<mat-card
  class="daxa-card basic-timeline-card mb-10 border-radius bg-white border-none d-block"
  [class.component-dark-theme]="themeService.isDark()"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Cronología de Actividades Diaria</h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ul class="timeline pl-0 mb-0 mt-0 list-unstyled">
      @if (timelineEntries().length) {
        <li
          class="position-relative"
          *ngFor="let meal of timelineEntries(); trackBy: mealTrackById"
        >
          <h5>{{ meal.mealType }}</h5>
          <span class="time d-block text-body">
            {{ meal.timeLabel }}
          </span>
          <p class="text-black mb-1">{{ meal.description }}</p>
          @if (meal.kcalLabel) {
            <span class="text-body kcal-label">{{ meal.kcalLabel }}</span>
          }
        </li>
      } @else {
        <li class="position-relative text-center text-body">
          No hay comidas registradas hoy.
        </li>
      }
    </ul>
  </mat-card-content>
</mat-card>
