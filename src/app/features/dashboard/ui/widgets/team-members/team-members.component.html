<mat-card
  class="daxa-card team-members-card mb-25 border-radius bg-white border-none d-block"
  [class.component-dark-theme]="themeService.isDark()"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Patients</h5>
    </mat-card-title>
    <mat-card-subtitle>
      <span class="card-header-link-btn">
        Total: {{ totalPatients() }}
      </span>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="team-members-table">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th scope="col" class="fw-medium text-black text-left">
                Patient
              </th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngIf="loading(); else dataState">
              <tr>
                <td class="text-center text-body py-3">
                  Cargando pacientes...
                </td>
              </tr>
            </ng-container>
            <ng-template #dataState>
              <ng-container *ngIf="patients().length; else emptyState">
                <tr *ngFor="let patient of patients(); trackBy: trackByPatient">
                  <td>
                    <div class="info d-flex align-items-center">
                      <div class="image">
                        <img
                          [ngSrc]="patient.avatarUrl"
                          [alt]="patient.fullName"
                          height="200"
                          width="200"
                        />
                      </div>
                      <div>
                        <span class="d-block fw-medium">
                          {{ patient.fullName }}
                        </span>
                      </div>
                    </div>
                  </td>
                </tr>
              </ng-container>
            </ng-template>
          </tbody>
        </table>
        <ng-template #emptyState>
          <tr>
            <td class="text-center text-body py-3">
              {{
                error()
                  ? "No pudimos cargar tus pacientes."
                  : "Aún no tienes pacientes registrados."
              }}
            </td>
          </tr>
        </ng-template>
      </div>
    </div>
  </mat-card-content>
</mat-card>
